spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
        max.block.ms: 3000

  http:
    client:
      connectionTimeout: 5000
      readTimeout: 5000

  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 5000
            readTimeout: 5000

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

merchant-service:
  url: ${MERCHANT_SERVICE_URL:http://localhost:8082}

logging:
  file:
    name: logs/payment-service.log

  level:
    com.payments.payment_service.payment.event.outbox: WARN
    root: INFO

resilience4j:
  circuitbreaker:
    instances:
      kafkaProducer:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50.0
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: payment-service
    description: Core payment orchestration service

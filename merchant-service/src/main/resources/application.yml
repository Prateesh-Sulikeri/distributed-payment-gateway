server:
  port: ${MERCHANT_PORT:8082}

spring:
  datasource:
    url: ${MERCHANT_DB_URL}
    username: ${MERCHANT_DB_USERNAME}
    password: ${MERCHANT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    locations: classpath:db/migration

logging:
  level:
    root: INFO
  file:
    name: logs/merchant-service.log